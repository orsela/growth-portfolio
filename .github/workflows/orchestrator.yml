name: Portfolio Multi-Agent Orchestrator
on:
  schedule:
    - cron: '22 14 * * 1-5'
    - cron: '35 13-20 * * 1-5'
  workflow_dispatch:
    inputs:
      task:
        description: 'Task (all / market / micha / research)'
        required: true
        default: 'all'
      ticker:
        description: 'Ticker for research'
        required: false
        default: 'PLTR'
permissions:
  contents: write
jobs:
  run-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance youtube-transcript-api google-generativeai requests
      - run: python cloud_agents.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          AGENT_TASK: ${{ github.event.inputs.task }}
          TARGET_TICKER: ${{ github.event.inputs.ticker }}
      - run: |
          git config --local user.email 'agents@growth-portfolio.local'
          git config --local user.name 'Portfolio Agents Bot'
          git add data/state.json
          if git diff --staged --quiet; then echo "No changes"; else git commit -m "chore(agents): sync state" && git push origin main; fi